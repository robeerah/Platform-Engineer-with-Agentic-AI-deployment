# Shared platform services (owned by the platform team).
# Everything uses host networking so it can reach Nomad-run containers on
# 127.0.0.1 exactly like a real single-node setup. Requires Linux / WSL2
# with Docker Engine installed inside the distro (not Docker Desktop).
#
# Ports: Consul 8500 | etcd 2379 | APISIX 9080 (proxy) 9180 (admin) 9091 (metrics)
#        Prometheus 9090 | Alertmanager 9093 | Grafana 3000
name: platform-lab

services:
  consul:
    image: hashicorp/consul:1.20.1
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui"]
    network_mode: host
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://127.0.0.1:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://127.0.0.1:2380
    network_mode: host
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped

  apisix:
    image: apache/apisix:3.11.0-debian
    network_mode: host
    depends_on: [etcd, consul]
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  etcd-data:
